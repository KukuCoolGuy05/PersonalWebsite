    <script>
      // Apply saved theme + motion preferences before first paint so nothing flashes.
      (function () {
        var root = document.documentElement;
        var theme = null;
        var motion = null;
        try {
          theme = localStorage.getItem('theme');
          motion = localStorage.getItem('motion');
        } catch (e) {}
        if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
        if (motion !== 'full' && motion !== 'reduce') {
          motion = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduce' : 'full';
        }
        root.dataset.motion = motion;
      })();
    </script>

  <body>
    <noscript>This site needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
